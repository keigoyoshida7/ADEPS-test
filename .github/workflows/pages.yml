name: Verify and deploy ADEPS-test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import the reviewed source archive when present
        if: hashFiles('ADEPS-test-source.zip') != ''
        run: |
          python3 -m zipfile -e ADEPS-test-source.zip .
          chmod +x ADEPS-test.command
          rm ADEPS-test-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import reviewed ADEPS-test source'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:numerics
      - run: npm run test:max
      - run: npm run test:studio
      - run: npm run test:plus
      - run: npm run test:paper-metrics
      - run: npm run build
        env:
          VITE_BASE_PATH: /ADEPS-test/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
